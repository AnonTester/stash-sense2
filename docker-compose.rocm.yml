# AMD ROCm GPU variant -- the one actually built and run on the reference
# deployment (AMD Radeon 780M / gfx1103). See Dockerfile.rocm for the full
# story on the package choices this needed.
#
#   docker compose -f docker-compose.rocm.yml build
#   docker compose -f docker-compose.rocm.yml up -d
services:
  stash-sense2-rocm:
    build:
      context: .
      dockerfile: Dockerfile.rocm
    image: stash-sense2-rocm:local
    container_name: stash-sense2-rocm
    restart: unless-stopped
    ports:
      - "6960:5000"
    volumes:
      - ./api/data:/data
      - stash-sense2-rocm-insightface:/root/.insightface
    environment:
      - STASH_URL=${STASH_URL:-http://stash:9999}
      - STASH_API_KEY=${STASH_API_KEY}
      - DATA_DIR=/data
      - DATABASE_UPDATE_REPO=AnonTester/stash-sense2-data
      - PYTHONUNBUFFERED=1
      # See docker-compose.yml for the full FFMPEG_HWACCEL explanation --
      # `vaapi` is the natural pairing here (reuses the /dev/dri device
      # already mapped in below for VAAPI-accelerated decode).
      - FFMPEG_HWACCEL=vaapi
      # Cards outside ROCm's officially-supported target list need this set
      # to their nearest supported gfx version, or inference segfaults
      # (see Dockerfile.rocm). Defaults to the value the reference
      # deployment needs (Radeon 780M / gfx1103) -- override by setting
      # HSA_OVERRIDE_GFX_VERSION in your shell or .env before `up`, or by
      # editing this line directly, to match *your* card instead. Check
      # `rocminfo`'s reported gfx version on your host if inference fails
      # to initialize. Leave unset (remove this line) if your card is
      # fully supported and doesn't need an override at all.
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-11.0.0}
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  stash-sense2-rocm-insightface:
