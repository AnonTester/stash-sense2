# AMD ROCm GPU variant -- the one actually built and run on the reference
# deployment (AMD Radeon 780M / gfx1103). See Dockerfile.rocm for the full
# story on the package choices this needed.
#
# Pre-built images are published to GHCR on every tagged release -- no
# local build needed:
#
#   docker compose -f docker-compose.rocm.yml up -d
#
# To build locally instead (e.g. testing an unreleased change):
#
#   docker compose -f docker-compose.rocm.yml build
#   docker compose -f docker-compose.rocm.yml up -d
services:
  stash-sense2-rocm:
    build:
      context: .
      dockerfile: Dockerfile.rocm
    image: ghcr.io/anontester/stash-sense2-rocm:latest
    container_name: stash-sense2-rocm
    restart: unless-stopped
    ports:
      - "6960:5000"
    volumes:
      - ./api/data:/data
      - stash-sense2-rocm-insightface:/root/.insightface
    environment:
      - STASH_URL=${STASH_URL:-http://stash:9999}
      - STASH_API_KEY=${STASH_API_KEY}
      - DATA_DIR=/data
      - DATABASE_UPDATE_REPO=AnonTester/stash-sense2-data
      - PYTHONUNBUFFERED=1
      # See docker-compose.yml for the full FFMPEG_HWACCEL explanation --
      # `vaapi` is the natural pairing here (reuses the /dev/dri device
      # already mapped in below for VAAPI-accelerated decode).
      - FFMPEG_HWACCEL=vaapi
      # Commented out by default -- most cards are on ROCm's officially
      # supported target list and don't need this. Cards outside that
      # list need it set to the nearest *supported* gfx target, not their
      # own literal chip id -- rocBLAS's bundled kernel library doesn't
      # ship a file for every real chip (gfx1103 itself, on the reference
      # deployment's Radeon 780M, segfaults on the first real inference
      # call for exactly this reason). Check `rocminfo`'s reported gfx
      # version, then uncomment and set this to the nearest value rocBLAS
      # actually has a kernel for -- 11.0.0 below is what works for the
      # 780M. See README's GPU Troubleshooting section for the host
      # kernel parameter this card also needed.
      # - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-11.0.0}
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  stash-sense2-rocm-insightface:
