name: Stash Sense 2
description: ML-powered performer identification and library curation for Stash
version: 0.14.20
url: https://github.com/AnonTester/stash-sense2

ui:
  javascript:
    - stash-sense-core.js
    - stash-sense-recommendations.js
    - stash-sense-settings.js
    - stash-sense-operations.js
    - stash-sense.js
  css:
    - stash-sense.css

settings:
  sidecarUrl:
    displayName: Stash Sense 2 API URL
    description: URL of the Stash Sense 2 sidecar container (e.g., http://localhost:5000)
    type: STRING
  minConfidence:
    displayName: Minimum Confidence
    description: Minimum confidence threshold for matches (0-100, higher is stricter)
    type: STRING
  maxResults:
    displayName: Maximum Results
    description: Maximum number of matches to show per detected face
    type: STRING

exec:
  - python
  - "{pluginDir}/stash_sense_backend.py"
interface: raw

hooks:
  - name: hook_local_performer_sync
    description: Keep the local performer identification index in sync with performer changes.
    triggeredBy:
      - Performer.Create.Post
      - Performer.Update.Post
      - Performer.Destroy.Post
