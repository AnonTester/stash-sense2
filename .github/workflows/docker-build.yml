name: Build and Push Docker Images

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: stash-sense2
          - dockerfile: Dockerfile.rocm
            image: stash-sense2-rocm
          - dockerfile: Dockerfile.cuda
            image: stash-sense2-cuda

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate version files match tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          ./scripts/check-version.sh "$TAG_VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') }}
            type=raw,value=beta,enable=${{ contains(github.ref, 'beta') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}

# Publishes 3 image variants (CPU default, AMD ROCm, NVIDIA CUDA -- see
# each Dockerfile.* for hardware-specific build notes) to GHCR under this
# repo's own namespace, e.g. ghcr.io/anontester/stash-sense2. The CUDA
# variant is built here (compile-checked) but not runtime-tested anywhere
# in this project's own CI/CD -- see README's GPU acceleration section for
# that caveat. Triggered on version tags (`git tag v0.14.5 && git push
# --tags`), not on every push to main -- this is the deliberate "cut a
# release" point, matching CLAUDE.md's version-bump convention, not a
# build-on-every-commit pipeline.
