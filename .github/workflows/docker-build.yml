name: Build and Push Docker Images

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: stash-sense2
          - dockerfile: Dockerfile.rocm
            image: stash-sense2-rocm
          - dockerfile: Dockerfile.cuda
            image: stash-sense2-cuda

    steps:
      # ROCm's own packages need ~15GB, twice over (once per build stage in
      # Dockerfile.rocm's multi-stage build) -- GitHub's standard runner
      # only has ~14GB free by default, so the ROCm build fails with "No
      # space left on device" partway through dpkg unpacking without this.
      # Harmless (a couple minutes) for the other two variants.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate version files match tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          ./scripts/check-version.sh "$TAG_VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') }}
            type=raw,value=beta,enable=${{ contains(github.ref, 'beta') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache, not GHA cache: the Actions cache API caps out
          # at 10GB *shared across every cache entry in the repo*, and
          # ROCm's own apt packages (installed twice -- build stage and
          # runtime stage -- see Dockerfile.rocm) are large enough on
          # their own to evict everything else (including the CPU/CUDA
          # variants' caches, competing for the same 10GB budget) well
          # before the next tag build reuses it. A registry-hosted cache
          # image has no such cap -- each variant gets its own
          # `:buildcache` tag in GHCR, so the 3 variants no longer fight
          # each other for cache space either. First build after this
          # change still pays full cost seeding the cache; every build
          # after that should skip straight past the apt-get/pip stages
          # to `COPY api/ ./` whenever Dockerfile.rocm/requirements.docker.txt
          # haven't changed, which is most releases.
          # github.repository_owner ("AnonTester") is mixed-case; Docker
          # registry references must be all-lowercase. docker/metadata-
          # action (the main image tags above) lowercases this
          # automatically -- these cache refs are built by hand and don't
          # get that treatment for free, confirmed live: the very first
          # tag build after this cache backend switch failed outright with
          # "repository name ... must be lowercase" on all 3 matrix
          # variants, never even reaching a build step. toLower() fixes it.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ toLower(github.repository_owner) }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ toLower(github.repository_owner) }}/${{ matrix.image }}:buildcache,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}

# Publishes 3 image variants (CPU default, AMD ROCm, NVIDIA CUDA -- see
# each Dockerfile.* for hardware-specific build notes) to GHCR under this
# repo's own namespace, e.g. ghcr.io/anontester/stash-sense2. The CUDA
# variant is built here (compile-checked) but not runtime-tested anywhere
# in this project's own CI/CD -- see README's GPU acceleration section for
# that caveat. Triggered on version tags (`git tag v0.14.5 && git push
# --tags`), not on every push to main -- this is the deliberate "cut a
# release" point, matching CLAUDE.md's version-bump convention, not a
# build-on-every-commit pipeline.
